[package]
name = "state-store"
version = "0.1.0"
edition = "2021"
description = "state.store cell: typed ce-wire front door of the shared state store (same storage format as the Python ce.state.store server); also the CLI client"

[dependencies]
state-store-api = { path = "../state-store-api" }
ce-wire = { git = "https://github.com/ce-net/ce-door", rev = "b1da138ac2edf0e3d32c01d481b4b5812acf429d" }
ce-gate = { git = "https://github.com/ce-net/ce-door", rev = "b1da138ac2edf0e3d32c01d481b4b5812acf429d" }
libc = "0.2.190"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync"] }
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = { version = "1", features = ["preserve_order"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
rusqlite = { version = "0.32", features = ["bundled"] }
bytes = "1"
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
